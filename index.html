<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="shortcut icon" href="output-1.png" type="image/x-icon">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>StopWatch⏳</h1>
        <div class="time">
            <span class="seconds">00</span> :
            <span class="milli">00</span>
        </div>
        <div class="button-container">
            <button title="start" class="start">▶</button>
            <button title="stop" class="stop">⭕</button>
            <button title="Reset" class="reset">🔁</button>
        </div>
    </div>
</body>
</html>

<script src="script.js"></script>
